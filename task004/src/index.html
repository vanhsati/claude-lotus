function clipGroup(g, planes) { g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.clippingPlanes = planes; } }); }
clipGroup(heroGrey, [clipUp]);
clipGroup(hero, [clipDown]);

// ---------- text overlay ------------------------------------------------------------------------
function text(str, x, y, { size = 60, font = 'Playfair', style = 'normal', weight = 400, color = '#f4ead9', alpha = 1, align = 'center', track = 0, rise = 0, glow = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = `${style} ${weight} ${size * S}px ${font}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${track * S}px`;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow * S; }
  ctx.fillText(str, x * S, (y + rise * (1 - alpha)) * S);
  ctx.restore();
}
const label = (str, x, y, a, o = {}) => text(str.toUpperCase(), x, y, { font: 'Inter', weight: 500, size: 22, track: 7, color: '#d9b77e', alpha: a, ...o });

// ---------- shots -------------------------------------------------------------------------------
function hideAll() {
  for (const o of [...Object.values(lamps), stream, pool, drops, printBed, printLine, hero, heroGrey, mould, pourStream, ...layers]) o.visible = false;
}
function cam(pos, look, fov = 32) { camera.position.set(...pos); camera.lookAt(new THREE.Vector3(...look)); camera.fov = fov; camera.updateProjectionMatrix(); }
const ledCycle = (t, speed = 0.12, phase = 0) => hue(t * speed + phase, 0.95, 0.55);

const shots = [

  }, (t, lt) => {
    text('illuminating moments.', 960, 190, { size: 76, style: 'italic', alpha: fade(lt, 0.9, 5.0, 0.7), rise: 16 });

  [24.0, 35.0, (t, lt) => {

    order.forEach((k, i) => { const L = lamps[k]; L.visible = true; L.userData.block.position.y = 2.53; L.userData.inner.position.y = 0.6;
      L.position.set((i - 1) * 4.2, 0, i === 1 ? -0.6 : 0); L.rotation.y = (i - 1) * -0.35 + Math.sin(t * 0.3 + i) * 0.05;
      const modeT = Math.floor(lt / 2.2);                    // step through light modes like the remote does
      const col = lt < 6.6 ? ledCycle(t, 0.1, i * 0.33) : hue([0.58, 0.0, 0.83, 0.33, 0.12][(modeT + i) % 5], 0.95, 0.55);
      setLED(L, col, 0.75 + 0.25 * Math.sin(t * 2 + i)); });
    const jb = Math.sin(t * 1.6); lamps.wave.userData.bell.scale.set(1 + 0.06 * jb, 0.75 - 0.06 * jb, 1 + 0.06 * jb); lamps.wave.userData.bell.position.y = 2.25 + 0.08 * Math.sin(t * 0.8); lamps.wave.userData.tent.position.y = lamps.wave.userData.bell.position.y - 0.25; lamps.wave.userData.foam.position.y = (t * 0.2) % 0.6;
    lamps.moon.userData.petals.position.y = -((t * 0.15) % 0.5);
    lamps.space.userData.figure.position.y = 0.62 + Math.sin(t * 1.5) * 0.04;
    key.intensity = 12;
    const k = ease(win(lt, 0, 11));
    cam([lerp(-6, 6, k), lerp(3.6, 2.8, k), lerp(13.5, 12.2, k)], [lerp(-1.5, 1.5, k), 2.35, 0], 34);

    label('etsy.com/shop/ResinEpic', 640, 680, fade(lt, 1.3, 4.61, 0.5), { size: 26, color: '#f4ead9' });
  }],
];

// fade to black between shots
window.frame = async (t) => {
  hideAll();
  const shot = shots.find(([a, b]) => t >= a && t < b) || shots.at(-1);
  const [a, b, draw3d, draw2d] = shot;
  draw3d(t, t - a, b - a);
  scene.traverse(o => { if (o.userData.billboard) o.quaternion.copy(camera.quaternion); });
  composer.render();
  ctx.globalAlpha = 1; ctx.drawImage(gl.domElement, 0, 0);
  draw2d(t, t - a, b - a);
  // dip to black at every cut, fade in at the start and out at the end
  const cuts = shots.slice(1).map(sh => sh[0]);
  const d = Math.min(...cuts.map(c => Math.abs(t - c)));
  const k = Math.max(clamp(1 - d / 0.25), clamp(1 - t / 0.5), clamp((t - (DUR - 0.8)) / 0.8));
  if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
window.DUR = DUR;
await document.fonts.load('italic 40px Playfair'); await document.fonts.load('700 40px Playfair'); await document.fonts.load('500 20px Inter');
await document.fonts.load('400 40px Playfair', 'Hà Nội, Việt Nam');
window.ready = true;
