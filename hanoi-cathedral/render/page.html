<script type="module">

window.setup = async (opts) => {

function fadeMat(m, amt) {

  if (!fadeCache.has(key)) {

    if (c.color) c.color = c.color.clone().lerp(new THREE.Color(0xffffff), amt);

}

  model.updateMatrixWorld(true);
  ensureBoxes();
  const step = o.step ?? 1e9;
  const upto = o.upto ?? parts.length;
  const newSet = new Set(o.newIdx || []);
  const hide = new Set(o.hide || []);
  const box = new THREE.Box3();
  const focus = new THREE.Box3();
  parts.forEach((p, i) => {
    let vis = i < upto && !hide.has(i);
    if (o.onlyIdx) vis = o.onlyIdx.includes(i);
    if (o.upto === undefined && o.step !== undefined) vis = vis && ((p.userData.buildingStep ?? 0) + 1) <= step;

    for (const p of pts) { const v = p.clone().applyMatrix4(cam.matrixWorldInverse); if (v.z > -1) return false; const q = p.clone().project(cam); if (Math.abs(q.x) > mg || Math.abs(q.y) > mg) return false; } return true; };

  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.5;
  scene.background = o.bg ? new THREE.Color(o.bg) : null;
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL(o.jpeg ? 'image/jpeg' : 'image/png', 0.9);
