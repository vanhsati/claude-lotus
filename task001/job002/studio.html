<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Come My Way studio</title>
<link rel="stylesheet" href="../common/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; max-width: 100vw; }
  #ui { position: fixed; bottom: 0; left: 0; right: 0; color: #eee; font: 13px monospace; padding: 6px; background: rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script src="src/audio_data.js"></script>
<script src="src/job.js"></script>
<script src="../common/src/core.js"></script>
<script src="../common/src/type.js"></script>
<script src="src/lyrics.js"></script>
<script src="../common/src/frame.js"></script>
<script src="../common/src/chars/idol.js"></script>
<script src="../common/src/chars/clawd.js"></script>
<script src="../common/src/chars/dance.js"></script>
<script src="../common/src/chars/cast.js"></script>
<script src="../common/src/props.js"></script>
<script src="src/lacquer.js"></script>
<script src="src/scenes/manifest.js"></script>
<script>
// URL params: ?scale=0.5  &t=12.3 (show a still)  &play (live preview with audio)  &test=name (window.TESTS[name])
const Q = new URLSearchParams(location.search);
SX = parseFloat(Q.get('scale') || '1');
const cv = document.getElementById('c'); cv.width = Math.round(W * SX); cv.height = Math.round(H * SX);
X = cv.getContext('2d');
if (!Q.has('ui')) document.getElementById('ui').style.display = 'none';

async function loadScenes() {
  for (const f of (window.SCENE_FILES || [])) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'src/scenes/' + f; s.onload = res; s.onerror = () => rej(new Error('load ' + f)); document.body.appendChild(s); });
}
window.ready = (async () => {
  await document.fonts.load(FONT.hero(40)); await document.fonts.load(FONT.logo(40)); await document.fonts.load(FONT.logoL(40));
  await document.fonts.load(FONT.serifI(40)); await document.fonts.load(FONT.serif(40)); await document.fonts.load(FONT.mono(40)); await document.fonts.load(FONT.monoB(40));
  await document.fonts.load(FONT.ui(40)); await document.fonts.load(FONT.uiB(40)); await document.fonts.load(FONT.uiM(40)); await document.fonts.load(FONT.blk(40));
  await document.fonts.load(font(F.kr, 40, 900), '특이점'); await document.fonts.load(font(F.jp, 40, 900), '死神の目'); await document.fonts.load(font(F.sc, 40, 900), '你好');
  const VN = 'Anh đang đến đây, em ơi SƠN MÀI ặếữỹ';
  for (const f of [FONT.vn(40), FONT.vnB(40), FONT.vnR(40), FONT.vnI(40), FONT.vnIR(40), FONT.vnSans(40), FONT.vnSansB(40), FONT.vnSansM(40), FONT.hero(40), FONT.ui(40), FONT.uiB(40)]) await document.fonts.load(f, VN);
  buildTextures();
  await loadScenes();
  if (Q.get('test')) window.TEST = window.TESTS[Q.get('test')];
  return true;
})();
window.renderAt = t => { drawFrame(t); };
window.grab = (t, q = .93) => { drawFrame(t); return cv.toDataURL('image/jpeg', q); };

(async () => {
  await window.ready;
  if (Q.has('t')) drawFrame(parseFloat(Q.get('t')));
  if (Q.has('play')) {
    const au = new Audio('audio/pdoom.mp3'); au.currentTime = parseFloat(Q.get('t') || '0');
    document.body.onclick = () => au.paused ? au.play() : au.pause();
    const loop = () => { drawFrame(au.currentTime); document.getElementById('ui').textContent = au.currentTime.toFixed(2); requestAnimationFrame(loop); }; loop();
  }
})();
</script>
</body>
</html>
